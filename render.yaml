services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: Cors__Origins
        value: https://melvinthomas-dev.github.io
      - key: Email__Provider
        value: SendGrid

databases:
  - name: portfolio-db
    plan: free
